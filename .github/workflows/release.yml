# Pushing a tag like v1.0.0 tests the code, builds Linux and Windows binaries and
# publishes them as a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go vet ./... && go test -race ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "dist/merlin-connect-$version-$os-$arch$ext" ./cmd/merlin-connect
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
